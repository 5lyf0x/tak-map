name: Stage TAK Map i621 source update
on:
  push:
    branches: [tak-map-i621-staging]
    paths:
      - scripts/i621-source.patch
      - scripts/stage_i621.py
      - .github/workflows/stage-i621.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply i621 source patch and retain GitHub README
        run: |
          git apply --check scripts/i621-source.patch
          git apply scripts/i621-source.patch
          python3 scripts/stage_i621.py
          python3 scripts/test_release_i621.py
          python3 scripts/test_adsb_provider_failover_hotfix.py
          python3 -m py_compile tak_dashboard.py
      - name: Commit verified release source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Release TAK Map v1.4.0 i621: prioritized ADS-B provider failover"
          git push origin HEAD:tak-map-i621-staging
